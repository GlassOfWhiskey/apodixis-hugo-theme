{{ define "main" }}
<div class="people-grid">
  {{ $members := hugo.Data.people.members }}
  {{ range $members }}
  <div class="people-card">
    <div class="people-card-body">
      <span class="people-photo">
        <img src="{{ .photo }}" alt="{{ .name }}" width="200" height="200" loading="lazy">
      </span>
      <span class="people-name">{{ .name }}</span>
      {{ with .role }}<span class="people-role">{{ . }}</span>{{ end }}
    </div>
    <div class="people-links">
      {{ with .website }}
      <a href="{{ . }}" target="_blank" rel="noopener" class="people-icon" aria-label="Website">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </a>
      {{ end }}
      {{ with .orcid }}
      <a href="https://orcid.org/{{ . }}" target="_blank" rel="noopener" class="people-icon" aria-label="ORCID">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.372 0 0 5.372 0 12s5.372 12 12 12 12-5.372 12-12S18.628 0 12 0zM7.369 4.378c.525 0 .947.431.947.947s-.422.947-.947.947a.95.95 0 0 1-.947-.947c0-.525.422-.947.947-.947zm-.722 3.038h1.444v10.041H6.647V7.416zm3.562 0h3.9c3.712 0 5.344 2.653 5.344 5.025 0 2.578-2.016 5.025-5.325 5.025h-3.919V7.416zm1.444 1.303v7.444h2.297c3.272 0 4.022-2.484 4.022-3.722 0-2.016-1.284-3.722-4.097-3.722h-2.222z"/></svg>
      </a>
      {{ end }}
      {{ with .google_scholar }}
      <a href="https://scholar.google.com/citations?user={{ . }}" target="_blank" rel="noopener" class="people-icon" aria-label="Google Scholar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.242 13.769 0 9.5 12 0l12 9.5-5.242 4.269C17.548 12.827 14.978 12 12 12c-2.978 0-5.548.827-6.758 1.769z"/><path d="M12 10a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/></svg>
      </a>
      {{ end }}
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
